name: CI

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:

jobs:
  host-gates:
    name: Host gates (wasm-gc + native)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          moon version
          cc --version

      - name: Check
        run: moon check

      - name: Format
        run: moon fmt --check

      - name: Build wasm-gc
        run: moon build --target wasm-gc

      - name: Build native
        run: moon build --target native

      - name: Probe wasm-gc (expects 43)
        run: |
          output=$(moon run --target wasm-gc src/probe)
          echo "$output"
          test "$output" = "43"

      - name: Probe native (expects 42)
        run: |
          output=$(moon run --target native src/probe)
          echo "$output"
          test "$output" = "42"
